services:
  - type: web
    name: closecircle-api
    runtime: docker
    plan: free
    region: frankfurt
    autoDeployTrigger: "off"
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_POOL_MAX_SIZE
        value: "5"

  - type: web
    name: closecircle-dashboard
    runtime: static
    autoDeployTrigger: "off"
    rootDir: dashboard-admin
    buildCommand: npm ci && VITE_RENDER_GIT_COMMIT=$RENDER_GIT_COMMIT npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
