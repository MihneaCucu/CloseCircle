name: Verify location API contract

on:
  pull_request:
    branches: [dev, main, 'feature/SCRUM-*']
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# Temporary integration snapshot: PR #5 includes the unmerged PR #1-4 endpoints.
# Update this reviewed SHA when backend changes are ready to test together.
# This is a contract/backend pair check, not proof that dev contains the routes.
env:
  LOCATION_BACKEND_COMMIT: a505df189ebe7dec15eb75c92194072df7de3d30

jobs:
  contract:
    name: Validate OpenAPI and client payload examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/src/test/python/requirements-contract.txt
      - name: Install validation tools
        run: python -m pip install -r backend/src/test/python/requirements-contract.txt
      - name: Check specification and positive/negative payload examples
        run: python backend/src/test/python/check_api_contract.py

  http-contract:
    name: Check contract against real API and PostgreSQL
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned backend implementation
        uses: actions/checkout@v4
        with:
          repository: MihneaCucu/CloseCircle
          ref: ${{ env.LOCATION_BACKEND_COMMIT }}
          path: .backend-under-test
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: .backend-under-test/backend/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/src/test/python/requirements-contract.txt
      - name: Install validation and PostgreSQL tools
        run: |
          python -m pip install -r backend/src/test/python/requirements-contract.txt
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Build the pinned backend
        run: mvn -B -ntp -f .backend-under-test/backend/pom.xml clean verify
      - name: Verify actual upload, read, metadata and error responses
        run: python backend/src/test/python/check_location_contract_http.py --backend-root .backend-under-test/backend

  coverage:
    name: Measure unit and PostgreSQL coverage
    needs: http-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the same pinned backend
        uses: actions/checkout@v4
        with:
          repository: MihneaCucu/CloseCircle
          ref: ${{ env.LOCATION_BACKEND_COMMIT }}
          path: .backend-under-test
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: .backend-under-test/backend/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/src/test/python/requirements-contract.txt
      - name: Install validation and PostgreSQL tools
        run: |
          python -m pip install -r backend/src/test/python/requirements-contract.txt
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Run unit, PostgreSQL and HTTP contract suites with coverage
        run: python backend/src/test/python/run_backend_coverage.py --backend-root .backend-under-test/backend
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f backend/target/location-coverage/summary.md ]; then
            cat backend/target/location-coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve reports and exact tested revisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-location-coverage
          path: backend/target/location-coverage/
          if-no-files-found: warn
          retention-days: 14
