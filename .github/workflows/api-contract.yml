name: Verify location API contract

on:
  pull_request:
    branches: [dev, main, 'feature/SCRUM-*']
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate OpenAPI and client payload examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/src/test/python/requirements-contract.txt
      - name: Install validation tools
        run: python -m pip install -r backend/src/test/python/requirements-contract.txt
      - name: Check specification and positive/negative payload examples
        run: python backend/src/test/python/check_api_contract.py
