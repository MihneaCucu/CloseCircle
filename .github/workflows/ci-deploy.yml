name: Verify and deploy CloseCircle

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closecircle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify backend, Docker image, and dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Spring Boot backend
        run: mvn -B -ntp -f backend/pom.xml verify

      - name: Build backend Docker image
        run: docker build --tag closecircle-api:ci --file backend/Dockerfile backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard-admin/package-lock.json

      - name: Build React dashboard
        working-directory: dashboard-admin
        env:
          VITE_API_BASE_URL: https://closecircle-api.onrender.com
          VITE_RENDER_GIT_COMMIT: ${{ github.sha }}
        run: npm ci && npm run build

  deploy:
    name: Deploy and verify Render services
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger API deployment for this commit
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          DEPLOY_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Missing GitHub Actions secret RENDER_API_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          case "$DEPLOY_HOOK_URL" in
            *\?*) separator='&' ;;
            *) separator='?' ;;
          esac
          code=$(curl --silent --show-error --output "$RUNNER_TEMP/api-deploy.json" \
            --write-out '%{http_code}' --request POST \
            "${DEPLOY_HOOK_URL}${separator}ref=${DEPLOY_REF}")
          case "$code" in
            200|202) ;;
            *) echo "Render API deploy hook returned HTTP $code" >&2; exit 1 ;;
          esac
          echo "Render accepted API deploy request (HTTP $code)."

      - name: Trigger dashboard deployment for this commit
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DASHBOARD_DEPLOY_HOOK_URL }}
          DEPLOY_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Missing GitHub Actions secret RENDER_DASHBOARD_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          case "$DEPLOY_HOOK_URL" in
            *\?*) separator='&' ;;
            *) separator='?' ;;
          esac
          code=$(curl --silent --show-error --output "$RUNNER_TEMP/dashboard-deploy.json" \
            --write-out '%{http_code}' --request POST \
            "${DEPLOY_HOOK_URL}${separator}ref=${DEPLOY_REF}")
          case "$code" in
            200|202) ;;
            *) echo "Render dashboard deploy hook returned HTTP $code" >&2; exit 1 ;;
          esac
          echo "Render accepted dashboard deploy request (HTTP $code)."

      - name: Wait for API to serve this commit and report healthy
        env:
          API_BASE_URL: https://closecircle-api.onrender.com
          DEPLOY_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            info=$(curl --silent --show-error --fail --max-time 10 "$API_BASE_URL/actuator/info" || true)
            if printf '%s' "$info" | jq -e --arg sha "$DEPLOY_REF" '.app.commit == $sha' >/dev/null; then
              health=$(curl --silent --show-error --fail --max-time 10 "$API_BASE_URL/actuator/health")
              if printf '%s' "$health" | jq -e '.status == "UP"' >/dev/null; then
                echo "API serves commit $DEPLOY_REF and health is UP."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for the API to serve commit $DEPLOY_REF with health UP." >&2
          exit 1

      - name: Wait for dashboard to serve this commit
        env:
          DASHBOARD_URL: https://closecircle-dashboard.onrender.com
          DEPLOY_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            html=$(curl --silent --show-error --fail --max-time 10 "$DASHBOARD_URL/?deploy=$DEPLOY_REF" || true)
            if printf '%s' "$html" | grep -Fq "content=\"$DEPLOY_REF\""; then
              if printf '%s' "$html" | grep -Fq '<title>Welcome to CloseCircle</title>'; then
                echo "Dashboard serves commit $DEPLOY_REF."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for the dashboard to serve commit $DEPLOY_REF." >&2
          exit 1
