server:
  port: ${PORT:8080}
  address: 0.0.0.0
  shutdown: graceful

spring:
  application:
    name: closecircle-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/closecircle?sslmode=disable}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: 0
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 600000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

closecircle:
  jwt:
    # No fallback value: startup fails unless JWT_SECRET is set (see SecurityConfig).
    secret: ${JWT_SECRET:}
    # How long an access token stays valid; clients log in again after it expires.
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
        allowed-methods: GET, OPTIONS
        allowed-headers: Accept, Content-Type
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    defaults:
      enabled: false
    env:
      enabled: true

info:
  app:
    commit: ${RENDER_GIT_COMMIT:local}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.web.filter.CommonsRequestLoggingFilter: OFF
