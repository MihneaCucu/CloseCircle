server:
  port: ${PORT:8080}
  address: 0.0.0.0
  shutdown: graceful

spring:
  application:
    name: closecircle-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/closecircle?sslmode=disable}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: 0
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 600000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

closecircle:
  jwt:
    secret: ${JWT_SECRET:local-development-only-change-this-32-byte-secret}

management:
  endpoints:
    web:
      exposure:
        include: health
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
        allowed-methods: GET, OPTIONS
        allowed-headers: Accept, Content-Type
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.web.filter.CommonsRequestLoggingFilter: OFF
